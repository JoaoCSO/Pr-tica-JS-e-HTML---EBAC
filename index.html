<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação Numérica</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1 class="titulo">Validação Numérica</h1>
    <form class="formulario">
        <label for="campoA">Campo A:</label>
        <input type="number" id="campoA" name="campoA" placeholder="Digite um número" required><br><br>
        <label for="campoB">Campo B:</label>
        <input type="number" id="campoB" name="campoB" placeholder="Digite um número" required><br><br>
        <button class="form-butao" type="submit">Enviar</button>
        <p id="mensagem" class="mensagem"></p>
    </form>
    <script src="main.js"></script>
</body>
</html>
